# Overhead USB camera (usb_cam). Device /dev/cam_overhead comes from the udev rules.
/**:
  ros__parameters:
    video_device: "/dev/cam_overhead"
    frame_id: "overhead_camera_link"
    camera_name: "overhead_camera"
    image_width: 1280
    image_height: 720
    framerate: 10.0
    pixel_format: "mjpeg2rgb"
    io_method: "mmap"
    # Perception compares colours, so exposure and white balance must not drift.
    autoexposure: false
    auto_white_balance: false
    autofocus: false

[workspace]
name = "chessbot"
authors = ["Yadunund Vijay <yadunund@gmail.com>"]
description = "Play chess against a real robot arm"
license = "Apache-2.0"
channels = ["conda-forge", "https://prefix.dev/robostack-lyrical"]
platforms = ["linux-aarch64", "linux-64", "osx-arm64"]
version = "0.1.0"

# License policy: every dependency must be Apache-2.0 compatible.
# See docs/licensing.md before adding anything here.
#
# Zenoh is pinned to the version rmw_zenoh links (libzenohc 1.9.0) so that
# zenohd plus its REST plugin can serve as the ROS router.

[dependencies]
# robostack-lyrical only publishes py314 builds.
python = "3.14.*"
numpy = ">=2.3,<3"
scipy = "*"
pinocchio = ">=4,<5"
pydantic = ">=2,<3"
fastapi = "*"
uvicorn = "*"
pyyaml = "*"
# ament_python symlink installs rely on `setup.py develop`, removed in setuptools 80.
setuptools = ">=71,<80"

# Build / workspace tooling
colcon-common-extensions = "*"
cmake = ">=3.30,<4"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
vcstool = "*"
make = "*"
curl = "*"

# Real SO-101: build dependencies of feetech_ros2_driver
cpp-expected = ">=1.1.0,<2"
range-v3 = ">=0.12.0,<0.13"
libserial = "*"
pkg-config = "*"
ros-lyrical-pluginlib = "*"

# Perception: JSON parsing of the calibration profile (header-only, MIT)
nlohmann_json = "*"

# Visualization and recording: Rerun C++ SDK for the bridge, CLI for the viewer
librerun-sdk = "0.37.*"
rerun-sdk = "0.37.*"

# Router: zenohd with the REST plugin (see docs/ for why it replaces rmw_zenohd)
zenohd = "==1.9.0"
zenoh-plugin-rest = "==1.9.0"
zenoh-plugin-storage-manager = "==1.9.0"

# ROS 2
ros-lyrical-ros-core = "*"
ros-lyrical-ros2controlcli = "*"
ros-lyrical-ament-cmake = "*"
ros-lyrical-ament-cmake-python = "*"
ros-lyrical-rosidl-default-generators = "*"
ros-lyrical-xacro = "*"
ros-lyrical-launch-xml = "*"
ros-lyrical-rclcpp-components = "*"
ros-lyrical-rclcpp-action = "*"
ros-lyrical-rmw-zenoh-cpp = "*"
ros-lyrical-robot-state-publisher = "*"
ros-lyrical-tf2-ros = "*"
ros-lyrical-control-msgs = "*"
# The Rerun bridge logs these as spatial archetypes (paths, occupancy grids, markers).
ros-lyrical-nav-msgs = "*"
ros-lyrical-visualization-msgs = "*"
ros-lyrical-moveit-msgs = "*"
ros-lyrical-vision-msgs = "*"
# ros2_control
ros-lyrical-controller-manager = "*"
ros-lyrical-joint-state-broadcaster = "*"
ros-lyrical-joint-trajectory-controller = "*"
ros-lyrical-parallel-gripper-controller = "*"
# Simulation
ros-lyrical-ros-gz-sim = "*"
ros-lyrical-ros-gz-bridge = "*"
ros-lyrical-gz-ros2-control = "*"
gz-sim = ">=10,<11"

[pypi-dependencies]
# Zenoh Python bindings (for the key-value store), same Zenoh version as the router.
eclipse-zenoh = "==1.9.0"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"

# Reasoning model server (llama.cpp), in its own environment: CUDA build on linux-64.
[feature.llm.system-requirements]
cuda = "13"

[feature.llm.dependencies]
"llama.cpp" = "*"

[feature.llm.target.linux-64.dependencies]
"llama.cpp" = { version = "*", build = "cuda*" }

[feature.llm.tasks]
# Gemma 4 E4B (Apache-2.0) with vision, downloaded from Hugging Face on first run.
llm = { cmd = "llama-server -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --host 0.0.0.0 --port 8081 -ngl 99 -c 8192 --jinja" }

[environments]
dev = ["dev"]
llm = { features = ["llm"], no-default-feature = true }

[activation.env]
CMAKE_PREFIX_PATH = "${CONDA_PREFIX}"
ROS_DISTRO = "lyrical"
PYTHONNOUSERSITE = "1"
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
# Gazebo looks for system plugins (gz_ros2_control) here; it does not search the env's lib dir.
GZ_SIM_SYSTEM_PLUGIN_PATH = "${CONDA_PREFIX}/lib"
# Nodes connect to the chessbot router rather than scouting for one.
ZENOH_CONFIG_OVERRIDE = 'connect/endpoints=["tcp/127.0.0.1:7447"];scouting/multicast/enabled=false'

# ROS message packages export their Python binding libraries, and anything that links one
# without using it fails to dlopen later with "undefined symbol: PyLong_FromLong" (the
# Feetech driver, loaded by ros2_control, does). Our own packages ask for this in their
# CMakeLists; this covers the ones vendored from elsewhere.
[target.linux-64.activation.env]
LDFLAGS = "-Wl,--as-needed ${LDFLAGS}"

[target.linux-aarch64.activation.env]
LDFLAGS = "-Wl,--as-needed ${LDFLAGS}"

[tasks]
import-deps = { cmd = "mkdir -p external && vcs import external < chessbot.repos" }
build = { cmd = "colcon build --symlink-install --base-paths src external", depends-on = ["import-deps"] }
so101-urdf = { cmd = "bash -c 'source install/setup.bash && mkdir -p generated && xacro install/so_arm101_description/share/so_arm101_description/urdf/so_arm101.urdf.xacro > generated/so101.urdf'", depends-on = ["build"] }
reach-check = { cmd = "python tools/reach_check.py --urdf generated/so101.urdf", depends-on = ["so101-urdf"] }
# Stockfish: separate GPL-3.0 executable, built from pinned upstream source for the host CPU.
stockfish = { cmd = "make -C external/Stockfish/src -j build ARCH=native COMP=gcc && mkdir -p generated/bin && cp external/Stockfish/src/stockfish generated/bin/", depends-on = ["import-deps"] }

# Run
router = { cmd = "bash -c 'exec zenohd -c config/zenoh/router.json5 --plugin-search-dir \"$CONDA_PREFIX/lib\"'" }
real = { cmd = "bash -c 'source install/setup.bash && exec ros2 launch chessbot_bringup chessbot.launch.xml hardware:=real \"$@\"' --" }
sim = { cmd = "bash -c 'source install/setup.bash && exec ros2 launch chessbot_bringup chessbot.launch.xml hardware:=gazebo \"$@\"' --" }
# Regenerate the Rerun layout (src/chessbot_bringup/config/chessbot.rbl) after editing its script.
rerun-blueprint = { cmd = "python src/chessbot_bringup/rerun/make_blueprint.py" }
# Motion scenarios in simulation (start with: pixi run sim cameras:=false viewer:=none).
sim-test = { cmd = "bash -c 'source install/setup.bash && exec python tools/sim/suite.py \"$@\"' --" }
check = { cmd = "bash -c 'source install/setup.bash && exec python tools/check_stack.py \"$@\"' --" }

# USB cameras (V4L2) exist on Linux only.
[target.linux-64.dependencies]
ros-lyrical-usb-cam = "*"

[target.linux-aarch64.dependencies]
ros-lyrical-usb-cam = "*"

[target.osx-arm64.tasks]
# feetech_ros2_driver does not build on macOS (libserial); run the real stack from Linux.
build = { cmd = "colcon build --symlink-install --base-paths src external --packages-skip feetech_ros2_driver", depends-on = ["import-deps"] }
stockfish = { cmd = "make -C external/Stockfish/src -j build ARCH=native COMP=clang && mkdir -p generated/bin && cp external/Stockfish/src/stockfish generated/bin/", depends-on = ["import-deps"] }

[feature.dev.tasks]
lint = "ruff check . && ruff format --check ."
test = { cmd = "bash -c 'source install/setup.bash && exec pytest -q src'" }
